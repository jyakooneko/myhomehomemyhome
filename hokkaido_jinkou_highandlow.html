<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北海道人口ハイアンドロー</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #ecf0f1;
        }
        body { 
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        #game-container { 
            background: white; 
            width: 95%; 
            max-width: 800px; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            text-align: center; 
            position: relative;
        }
        .hidden { display: none !important; }
        
        /* タイトル・リザルト画面 */
        h1 { color: var(--primary); margin-bottom: 10px; font-size: 1.8rem; }
        .description { color: #7f8c8d; margin-bottom: 30px; line-height: 1.6; }
        .btn-main { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 18px 50px; 
            font-size: 1.2rem; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: 0.3s; 
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        .btn-main:hover { opacity: 0.9; transform: translateY(-2px); }

        /* プレイ画面 */
        .status-bar { display: flex; justify-content: space-between; margin-bottom: 20px; color: #7f8c8d; font-weight: bold; }
        .question-header { font-size: 1.4rem; font-weight: bold; margin-bottom: 25px; color: var(--primary); }
        .battle-field { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .city-card { flex: 1; display: flex; flex-direction: column; gap: 15px; max-width: 340px; }
        .vs { font-size: 1.5rem; font-weight: bold; color: #bdc3c7; font-style: italic; }
        
        .map-container { 
            width: 100%; 
            height: 220px; 
            background: #f9f9f9; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #eee;
        }
        iframe { width: 100%; height: 100%; border: none; pointer-events: none; }
        
        .city-btn { 
            background: white; 
            border: 2px solid var(--accent); 
            color: var(--accent); 
            padding: 15px 10px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .city-btn:hover { background: var(--accent); color: white; }

        /* 通知（トースト） */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            pointer-events: none;
        }
        .toast {
            min-width: 240px;
            padding: 15px 25px;
            margin-top: 10px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            animation: slideIn 0.4s ease-out, fadeOut 0.4s ease-in 2.5s forwards;
            text-align: left;
        }
        .toast.correct { background: var(--success); }
        .toast.wrong { background: var(--danger); }
        .toast-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 4px; }
        .toast-body { font-size: 0.85rem; opacity: 0.9; }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(20px); }
        }

        /* リザルト */
        .score-display { font-size: 4rem; color: var(--accent); margin: 20px 0; font-weight: bold; }
        
        @media (max-width: 600px) {
            .battle-field { flex-direction: column; }
            .vs { margin: 10px 0; }
            .map-container { height: 150px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="screen-title">
        <h1>北海道<br>人口ハイアンドロー</h1>
        <p class="description">
            どちらの市町村の人口が多いか当ててください。<br>
            人口が近い市町村を当てるほど高スコア<br>
            全30問
        </p>
        <button class="btn-main" onclick="startGame()">ゲームスタート</button>
    </div>

    <div id="screen-quiz" class="hidden">
        <div class="status-bar">
            <div id="current-round">Round: 1/30</div>
            <div id="current-score">Score: 0</div>
        </div>
        <div class="question-header">どちらの人口が多い？</div>
        <div class="battle-field">
            <div class="city-card">
                <div class="map-container" id="map-0"></div>
                <button class="city-btn" id="name-0" onclick="checkAnswer(0)"></button>
            </div>
            <div class="vs">VS</div>
            <div class="city-card">
                <div class="map-container" id="map-1"></div>
                <button class="city-btn" id="name-1" onclick="checkAnswer(1)"></button>
            </div>
        </div>
    </div>

    <div id="screen-result" class="hidden">
        <h1>結果発表</h1>
        <div class="score-display" id="final-score">0</div>
        <p id="rank-message"></p>
        <button class="btn-main" onclick="copyResult()">結果をコピーして共有</button>
        <br><br>
        <button style="background:#95a5a6; box-shadow:none;" class="btn-main" onclick="location.reload()">タイトルへ戻る</button>
    </div>
</div>

<div id="toast-container"></div>

];

let usedIndices = new Set();
let currentOptions = [];
let score = 0;
let round = 1;
const MAX_ROUND = 30;

function startGame() {
    score = 0;
    round = 1;
    usedIndices.clear();
    document.getElementById('screen-title').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-quiz').classList.remove('hidden');
    nextQuestion();
}

function nextQuestion() {
    if (round > MAX_ROUND) {
        endGame();
        return;
    }

    document.getElementById('current-round').innerText = `Round: ${round}/${MAX_ROUND}`;
    document.getElementById('current-score').innerText = `Score: ${score}`;

    // 未使用の市町村からランダムに2つ選出
    let available = [];
    for(let i=0; i<allCities.length; i++){
        if(!usedIndices.has(i)) available.push(i);
    }

    if (available.length < 2) {
        endGame();
        return;
    }

    const idx1 = available.splice(Math.floor(Math.random() * available.length), 1)[0];
    const idx2 = available.splice(Math.floor(Math.random() * available.length), 1)[0];
    
    usedIndices.add(idx1);
    usedIndices.add(idx2);
    
    currentOptions = [allCities[idx1], allCities[idx2]];

    updateCityUI(0, currentOptions[0]);
    updateCityUI(1, currentOptions[1]);
}

function updateCityUI(index, city) {
    document.getElementById(`name-${index}`).innerText = city.n;
    const mapDiv = document.getElementById(`map-${index}`);
    // Google Maps Embed (名称検索)
    mapDiv.innerHTML = `<iframe src="https://maps.google.co.jp/maps?output=embed&q=北海道${city.n}+役場&z=10&t=m"></iframe>`;
}

function showToast(isCorrect, points, selected, other) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${isCorrect ? 'correct' : 'wrong'}`;
    
    const titleText = isCorrect ? `正解！ +${points}点` : "不正解...";
    const bodyText = `${selected.n}: ${selected.p.toLocaleString()}人<br>${other.n}: ${other.p.toLocaleString()}人`;
    
    toast.innerHTML = `<div class="toast-title">${titleText}</div><div class="toast-body">${bodyText}</div>`;
    
    container.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 3000);
}

function checkAnswer(selectedIndex) {
    const otherIndex = selectedIndex === 0 ? 1 : 0;
    const selected = currentOptions[selectedIndex];
    const other = currentOptions[otherIndex];
    let isCorrect = false;
    let points = 0;

    if (selected.p >= other.p) {
        isCorrect = true;

        const ratio = Math.min(selected.p, other.p) / Math.max(selected.p, other.p);
        points = Math.round(100 + (ratio * 400));
        score += points;
    }

    showToast(isCorrect, points, selected, other);

    
    round++;
    setTimeout(nextQuestion, 400);
}

function endGame() {
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');
    document.getElementById('final-score').innerText = score.toLocaleString() + " pts";
    
    let msg = "北海道博士";
    if(score < 3000) msg = "北海道未履修";
    else if(score < 6000) msg = "北海道修士";
    document.getElementById('rank-message').innerText = msg;
}

function copyResult() {
    const text = `北海道人口ハイアンドローで ${score} 点稼ぎました！\n#北海道人口ハイアンドロー ${window.location.href}`;
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => alert("コピーしました！"));
    } else {
        alert("お使いのブラウザではコピー機能がサポートされていません。");
    }
}
</script>

</html>
